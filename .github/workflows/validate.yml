name: Validate items

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate.mjs'
      - 'js/validate-core.js'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validate.mjs'
      - 'js/validate-core.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs